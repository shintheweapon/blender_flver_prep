<svg xmlns="http://www.w3.org/2000/svg" width="680" height="310" viewBox="0 0 680 310" role="img">
<title>游戏原生模型的切线坐标系</title>
<desc>两个平放的 UV 岛，按游戏内所见，N 朝上，T 沿 +V 朝向观察者。在 FLVER 的左手坐标系中，N × T 遵循左手定则，指向左方。在非镜像岛上，+U 向右，因此 W = -1 使 N × T 指向 +U。在镜像岛上，+U 向左，N × T 已指向 +U，W = +1。</desc>
<style>
.t{fill:#1f2328;font:14px -apple-system,"Segoe UI",Helvetica,Arial,"Microsoft YaHei","PingFang SC","Noto Sans CJK SC","Source Han Sans SC",sans-serif}
.h{font-weight:600}
.s{fill:#59636e;font:12px -apple-system,"Segoe UI",Helvetica,Arial,"Microsoft YaHei","PingFang SC","Noto Sans CJK SC","Source Han Sans SC",sans-serif}
.o{stroke:#59636e}
.of{fill:#59636e}
.p{fill:#f6f8fa;stroke:#8c959f}
.g{stroke:#8c959f}
@media (prefers-color-scheme: dark){
.t{fill:#e6edf3}
.s{fill:#9198a1}
.o{stroke:#9198a1}
.of{fill:#9198a1}
.p{fill:#151b23;stroke:#656c76}
.g{stroke:#656c76}
}
</style>
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9z" fill="#E24B4A"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9z" fill="#639922"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9z" fill="#378ADD"/></marker><marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="of" d="M1 1L9 5L1 9z"/></marker></defs>
<polygon class="p" points="110,120 270,120 214,200 54,200" stroke-width="0.5"/>
<line x1="118" y1="108" x2="262" y2="108" class="o" stroke-width="1" marker-end="url(#ao)"/>
<text class="s" x="274" y="112" text-anchor="start">+U</text>
<line x1="96" y1="124" x2="40" y2="196" class="o" stroke-width="1" marker-end="url(#ao)"/>
<text class="s" x="36" y="216" text-anchor="middle">+V</text>
<text class="s" x="264" y="96" text-anchor="end">第 0 行</text>
<line x1="162" y1="160" x2="162" y2="76" class="o" stroke-width="2" marker-end="url(#ao)"/>
<text class="s" x="172" y="80" text-anchor="start">N</text>
<line x1="162" y1="160" x2="138.9" y2="193" stroke="#639922" stroke-width="2" marker-end="url(#ag)"/>
<line x1="162" y1="160" x2="110" y2="160" stroke="#E24B4A" stroke-width="1" stroke-dasharray="4 3"/>
<line x1="162" y1="160" x2="226" y2="160" stroke="#E24B4A" stroke-width="2" marker-end="url(#ar)"/>
<circle cx="162" cy="160" r="3" class="of"/>
<text class="t h" x="160" y="246" text-anchor="middle">非镜像岛，W = −1</text>
<polygon class="p" points="440,120 600,120 544,200 384,200" stroke-width="0.5"/>
<line x1="592" y1="108" x2="448" y2="108" class="o" stroke-width="1" marker-end="url(#ao)"/>
<text class="s" x="436" y="112" text-anchor="end">+U</text>
<line x1="426" y1="124" x2="370" y2="196" class="o" stroke-width="1" marker-end="url(#ao)"/>
<text class="s" x="366" y="216" text-anchor="middle">+V</text>
<text class="s" x="594" y="96" text-anchor="end">第 0 行</text>
<line x1="492" y1="160" x2="492" y2="76" class="o" stroke-width="2" marker-end="url(#ao)"/>
<text class="s" x="502" y="80" text-anchor="start">N</text>
<line x1="492" y1="160" x2="468.9" y2="193" stroke="#639922" stroke-width="2" marker-end="url(#ag)"/>
<line x1="492" y1="160" x2="428" y2="160" stroke="#E24B4A" stroke-width="2" marker-end="url(#ar)"/>
<circle cx="492" cy="160" r="3" class="of"/>
<text class="t h" x="490" y="246" text-anchor="middle">镜像岛，W = +1</text>
<line x1="70" y1="284" x2="94" y2="284" stroke="#639922" stroke-width="2"/>
<text class="s" x="100" y="288" text-anchor="start">T，沿 +V</text>
<line x1="200" y1="284" x2="224" y2="284" stroke="#E24B4A" stroke-width="2"/>
<text class="s" x="230" y="288" text-anchor="start">W(N × T)，沿 +U</text>
<line x1="380" y1="284" x2="404" y2="284" stroke="#E24B4A" stroke-width="1" stroke-dasharray="4 3"/>
<text class="s" x="410" y="288" text-anchor="start">N × T（左手定则）</text>
</svg>
