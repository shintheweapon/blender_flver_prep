<svg xmlns="http://www.w3.org/2000/svg" width="680" height="380" viewBox="0 0 680 380" role="img">
<title>The layout test on vanilla normal maps</title>
<desc>Horizontal bars, one per file-name prefix of the game's part normal maps, each split into the share of its testable maps on which the DirectX pairing (red with U, green with V) wins with a positive correlation, with a negative one (green inverted), or the swapped pairing wins. The DirectX pairing with a positive correlation fills almost every bar. Columns give the maps tested and the untestable maps per prefix.</desc>
<style>
.t{fill:#1f2328;font:14px -apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.h{font-weight:600}
.s{fill:#59636e;font:12px -apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.o{stroke:#59636e}
.of{fill:#59636e}
.p{fill:#f6f8fa;stroke:#8c959f}
.g{stroke:#8c959f}
@media (prefers-color-scheme: dark){
.t{fill:#e6edf3}
.s{fill:#9198a1}
.o{stroke:#9198a1}
.of{fill:#9198a1}
.p{fill:#151b23;stroke:#656c76}
.g{stroke:#656c76}
}
</style>
