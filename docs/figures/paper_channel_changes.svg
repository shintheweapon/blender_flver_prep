<line x1="161.7" y1="241.7" x2="140.5" y2="220.5" stroke="#E24B4A" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="190" y1="230" x2="190" y2="200" stroke="#E24B4A" stroke-width="1.5" marker-end="url(#ar)"/>
