<svg xmlns="http://www.w3.org/2000/svg" width="680" height="442" viewBox="0 0 680 442" role="img">
<title>Matching the map to tangents along +U</title>
<desc>Two columns, without a mirror and with Z mirrored, each with two domes seen from above. Top: the map as authored, read through tangents along +U: without a mirror every normal is rotated by 90 degrees anticlockwise and points sideways; with Z mirrored every normal is reflected about the line U = V, so the normals on that diagonal point outward and those on the other diagonal inward. Bottom: the map after the channel change, (20) or (21): every normal points outward, as authored. The changes are derived from the measured frames, not tested in game.</desc>
