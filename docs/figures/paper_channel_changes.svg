<text class="s" x="490" y="362" text-anchor="middle">After (21): outward, as authored</text>
<line x1="60" y1="398" x2="84" y2="398" stroke="#E24B4A" stroke-width="2" marker-end="url(#ar)"/>
<text class="s" x="90" y="402" text-anchor="start">Outward (raised)</text>
