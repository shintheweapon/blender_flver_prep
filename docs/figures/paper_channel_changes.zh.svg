<svg xmlns="http://www.w3.org/2000/svg" width="680" height="424" viewBox="0 0 680 424" role="img">
<title>使贴图与沿 +U 的切线相匹配</title>
<desc>两列，分别为无镜像和 Z 轴镜像，每列有两个从上方看的圆顶。上：按原样制作的贴图，经沿 +U 的切线读取：无镜像时每条法线逆时针旋转 90 度，指向侧面；Z 轴镜像时每条法线变为关于直线 U = V 对称的方向，该对角线上的法线朝外，另一条对角线上的朝内。下：通道变换 (20) 或 (21) 之后的贴图：每条法线都朝外，与制作时一致。这些变换由实测的切线坐标系推导得出，未在游戏内测试。</desc>
<style>
.t{fill:#1f2328;font:14px -apple-system,"Segoe UI",Helvetica,Arial,"Microsoft YaHei","PingFang SC","Noto Sans CJK SC","Source Han Sans SC",sans-serif}
.h{font-weight:600}
.s{fill:#59636e;font:12px -apple-system,"Segoe UI",Helvetica,Arial,"Microsoft YaHei","PingFang SC","Noto Sans CJK SC","Source Han Sans SC",sans-serif}
.o{stroke:#59636e}
.of{fill:#59636e}
.p{fill:#f6f8fa;stroke:#8c959f}
.g{stroke:#8c959f}
@media (prefers-color-scheme: dark){
.t{fill:#e6edf3}
.s{fill:#9198a1}
.o{stroke:#9198a1}
.of{fill:#9198a1}
.p{fill:#151b23;stroke:#656c76}
.g{stroke:#656c76}
}
</style>
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9z" fill="#E24B4A"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9z" fill="#639922"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9z" fill="#378ADD"/></marker><marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="of" d="M1 1L9 5L1 9z"/></marker></defs>
<text class="t h" x="190" y="30" text-anchor="middle">无镜像</text>
<circle cx="190" cy="110" r="40" fill="none" class="o" stroke-width="0.5" stroke-dasharray="3 3"/>
<line x1="230" y1="110" x2="230" y2="80" class="o" stroke-width="1.5" marker-end="url(#ao)"/>
<line x1="218.3" y1="138.3" x2="239.5" y2="117.1" class="o" stroke-width="1.5" marker-end="url(#ao)"/>
<line x1="190" y1="150" x2="220" y2="150" class="o" stroke-width="1.5" marker-end="url(#ao)"/>
<line x1="161.7" y1="138.3" x2="182.9" y2="159.5" class="o" stroke-width="1.5" marker-end="url(#ao)"/>
<line x1="150" y1="110" x2="150" y2="140" class="o" stroke-width="1.5" marker-end="url(#ao)"/>
<line x1="161.7" y1="81.7" x2="140.5" y2="102.9" class="o" stroke-width="1.5" marker-end="url(#ao)"/>
<line x1="190" y1="70" x2="160" y2="70" class="o" stroke-width="1.5" marker-end="url(#ao)"/>
<line x1="218.3" y1="81.7" x2="197.1" y2="60.5" class="o" stroke-width="1.5" marker-end="url(#ao)"/>
<text class="s" x="190" y="184" text-anchor="middle">原样贴图：逆时针旋转 90°</text>
<circle cx="190" cy="270" r="40" fill="none" class="o" stroke-width="0.5" stroke-dasharray="3 3"/>
<line x1="230" y1="270" x2="260" y2="270" stroke="#E24B4A" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="218.3" y1="298.3" x2="239.5" y2="319.5" stroke="#E24B4A" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="190" y1="310" x2="190" y2="340" stroke="#E24B4A" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="161.7" y1="298.3" x2="140.5" y2="319.5" stroke="#E24B4A" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="150" y1="270" x2="120" y2="270" stroke="#E24B4A" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="161.7" y1="241.7" x2="140.5" y2="220.5" stroke="#E24B4A" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="190" y1="230" x2="190" y2="200" stroke="#E24B4A" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="218.3" y1="241.7" x2="239.5" y2="220.5" stroke="#E24B4A" stroke-width="1.5" marker-end="url(#ar)"/>
<text class="s" x="190" y="344" text-anchor="middle">经 (20) 变换后：朝外，与制作时一致</text>
<text class="t h" x="490" y="30" text-anchor="middle">Z 轴镜像</text>
<circle cx="490" cy="110" r="40" fill="none" class="o" stroke-width="0.5" stroke-dasharray="3 3"/>
<line x1="530" y1="110" x2="530" y2="140" class="o" stroke-width="1.5" marker-end="url(#ao)"/>
<line x1="518.3" y1="138.3" x2="539.5" y2="159.5" stroke="#E24B4A" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="490" y1="150" x2="520" y2="150" class="o" stroke-width="1.5" marker-end="url(#ao)"/>
<line x1="461.7" y1="138.3" x2="482.9" y2="117.1" stroke="#378ADD" stroke-width="1.5" marker-end="url(#ab)"/>
<line x1="450" y1="110" x2="450" y2="80" class="o" stroke-width="1.5" marker-end="url(#ao)"/>
<line x1="461.7" y1="81.7" x2="440.5" y2="60.5" stroke="#E24B4A" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="490" y1="70" x2="460" y2="70" class="o" stroke-width="1.5" marker-end="url(#ao)"/>
<line x1="518.3" y1="81.7" x2="497.1" y2="102.9" stroke="#378ADD" stroke-width="1.5" marker-end="url(#ab)"/>
<text class="s" x="490" y="184" text-anchor="middle">原样贴图：关于 U = V 对称</text>
<circle cx="490" cy="270" r="40" fill="none" class="o" stroke-width="0.5" stroke-dasharray="3 3"/>
<line x1="530" y1="270" x2="560" y2="270" stroke="#E24B4A" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="518.3" y1="298.3" x2="539.5" y2="319.5" stroke="#E24B4A" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="490" y1="310" x2="490" y2="340" stroke="#E24B4A" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="461.7" y1="298.3" x2="440.5" y2="319.5" stroke="#E24B4A" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="450" y1="270" x2="420" y2="270" stroke="#E24B4A" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="461.7" y1="241.7" x2="440.5" y2="220.5" stroke="#E24B4A" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="490" y1="230" x2="490" y2="200" stroke="#E24B4A" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="518.3" y1="241.7" x2="539.5" y2="220.5" stroke="#E24B4A" stroke-width="1.5" marker-end="url(#ar)"/>
<text class="s" x="490" y="344" text-anchor="middle">经 (21) 变换后：朝外，与制作时一致</text>
<line x1="60" y1="380" x2="84" y2="380" stroke="#E24B4A" stroke-width="2" marker-end="url(#ar)"/>
<text class="s" x="90" y="384" text-anchor="start">朝外（凸起）</text>
<line x1="240" y1="380" x2="264" y2="380" stroke="#378ADD" stroke-width="2" marker-end="url(#ab)"/>
<text class="s" x="270" y="384" text-anchor="start">朝内（凹陷）</text>
<line x1="420" y1="380" x2="444" y2="380" class="o" stroke-width="2" marker-end="url(#ao)"/>
<text class="s" x="450" y="384" text-anchor="start">侧向</text>
<text class="s" x="340" y="408" text-anchor="middle">由实测的切线坐标系推导得出；未在游戏内测试。</text>
</svg>
